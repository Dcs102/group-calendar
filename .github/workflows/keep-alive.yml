name: Supabase keep-alive
on:
  schedule:
    - cron: "0 12 * * *"   # every day at 12:00 UTC
  workflow_dispatch: {}     # lets you trigger it manually too

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase to reset inactivity timer
        run: |
          curl -fsS -o /dev/null \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            "https://qlvuspkkxnjwdfvkydum.supabase.co/rest/v1/events?select=id&limit=1" \
            || echo "ping failed (project may be paused)"
